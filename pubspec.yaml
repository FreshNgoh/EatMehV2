name: eatmeh
description: Social health tracking app with AI meal analysis
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Camera & Media
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  video_player: ^2.9.1

  # Image Processing
  image: ^4.2.0
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1

  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_staggered_grid_view: ^0.7.0

  # Stories (Snapchat-like)
  story_view: ^0.16.5

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # API & Networking
  dio: ^5.7.0
  http: ^1.2.2

  # Local Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  flutter_dotenv: ^5.1.0
  uuid: ^4.5.1
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

  # Charts & Analytics
  fl_chart: ^0.69.0
  syncfusion_flutter_charts: ^27.1.58

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Date & Time
  timeago: ^3.7.0

  # Toast & Dialogs
  fluttertoast: ^8.2.8

  # QR Code (for user ID sharing)
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1

  # Animations
  lottie: ^3.1.3
  animate_do: ^3.3.4

  # Onboarding
  introduction_screen: ^3.1.14

  # PDF (for reports)
  pdf: ^3.11.1
  printing: ^5.13.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/languages/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
