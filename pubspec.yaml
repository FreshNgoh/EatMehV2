name: eatmehv2
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  firebase_core:
  cloud_firestore:
  firebase_auth:
  firebase_storage:
  bloc:
  dio:
  meta:
  image_picker:
  path_provider:
  flutter_bloc:
  cached_network_image:
  photo_view:
  flutter_svg:
  fluttertoast:
  image_gallery_saver_plus: ^4.0.1
  permission_handler:
  flutter_dotenv:
  provider:
  equatable:
  smooth_page_indicator: ^1.2.1
  flutter_form_builder:
  form_builder_validators:

  # Localization
  flutter_localizations:
    sdk: flutter
  intl:

  # Local Storage
  shared_preferences:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/default_face.jpeg
    - assets/logo/logo.png
    - assets/languages/
    - assets/teralero.png
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Bold.ttf
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-SemiBold.ttf
